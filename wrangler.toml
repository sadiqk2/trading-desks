# Cloudflare Worker config for the hosted NSE relay (bridge/nse-worker.js).
#
# Deploy without installing anything:
#   https://deploy.workers.cloudflare.com/?url=https://github.com/sadiqk2/trading-desks
# Or with the CLI:
#   npx wrangler deploy
#
# The relay runs the same live-only code as the Node servers (bridge/nse-core.js).

name = "nse-live-relay"
main = "bridge/nse-worker.js"
compatibility_date = "2025-01-15"
workers_dev = true

[vars]
# Where the relay's setup page links back to (your dashboard deployment).
DASHBOARD_BASE = "https://sadiqk2.github.io/trading-desks"
